name: Foundation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation-audit:
    name: Foundation Verification
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick librsvg2-bin

      - name: Verify Brand Invariants
        run: python3 scripts/verify_brand.py

      - name: Verify Brand Regeneration Determinism
        run: |
          python3 scripts/generate_brand.py
          git diff --exit-code assets/brand/

      - name: Verify Foundation Integrity
        run: python3 scripts/verify_foundation.py
